name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate distribution
        run: python3 scripts/validate_distribution.py

      - name: Check Claude distribution drift
        run: python3 scripts/sync_claude_distribution.py --check

      - name: Build Claude.ai skill packages
        run: python3 scripts/create_skill_zips.py

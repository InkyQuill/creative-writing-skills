name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release version consistency
        run: python3 scripts/automatic_release.py check

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate distribution
        run: python3 scripts/validate_distribution.py

      - name: Check Claude distribution drift
        run: python3 scripts/sync_claude_distribution.py --check

      - name: Build Claude.ai skill packages
        run: python3 scripts/create_skill_zips.py

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate distribution
        run: python3 scripts/validate_distribution.py

      - name: Check Claude distribution drift
        run: python3 scripts/sync_claude_distribution.py --check

      - name: Verify tag matches canonical plugin version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(python3 -c 'import json; print(json.load(open("plugins/creative-writing-skills/.codex-plugin/plugin.json"))["version"])')"
          if [ "${tag}" != "v${version}" ]; then
            echo "::error::Tag ${tag} does not match canonical plugin version ${version}"
            exit 1
          fi

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Claude.ai skill packages
        run: python3 scripts/create_skill_zips.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: zips/*.skill
